name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reservme
          POSTGRES_PASSWORD: reservme_dev_password
          POSTGRES_DB: reservme
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U reservme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://reservme:reservme_dev_password@localhost:5433/reservme
      BETTER_AUTH_SECRET: ci-secret-thirty-two-bytes-minimum-000
      BETTER_AUTH_URL: http://app.localhost:3000
      NEXT_PUBLIC_APEX_HOST: localhost:3000
      NEXT_PUBLIC_APP_HOST: app.localhost:3000
      NEXT_PUBLIC_ADMIN_HOST: admin.localhost:3000
      NEXT_PUBLIC_PROTOCOL: http

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fail the build on a high/critical advisory. Moderates are surfaced but
      # don't gate (today: 5 moderate, all transitive under better-auth).
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npx eslint src scripts test packages

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Migrate + seed
        run: |
          npx tsx scripts/migrate.ts
          npx tsx scripts/seed.ts

      # The full Vitest suite (24 DB/lib-level scenarios — booking concurrency,
      # management, rate limiting, analytics, CRM, calendar, auth, billing,
      # branding, self-service, staff, waitlist, export, reminders, pricing,
      # sessions, portfolio, promo, engagement, memberships, integrations,
      # suspension, admin ops, storage) with coverage. It migrates + seeds
      # itself, so it also stands alone from a fresh clone.
      - name: Vitest (+ coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      # HTTP suites need the app running; start web + worker in the background.
      - name: Start app
        run: |
          npm run start &
          echo "WEB_PID=$!" >> "$GITHUB_ENV"
          npx tsx scripts/worker.ts &
          echo "WORKER_PID=$!" >> "$GITHUB_ENV"
          npx wait-on http://localhost:3000/api/healthz --timeout 60000

      - name: Onboarding, admin, and jobs
        run: |
          npx tsx scripts/test-onboarding.ts
          npx tsx scripts/test-admin.ts
          npx tsx scripts/test-jobs.ts

      - name: Stop app
        if: always()
        run: |
          kill "$WEB_PID" "$WORKER_PID" 2>/dev/null || true

  # The standalone static marketing site is its own npm package with its own
  # lockfile. Build it too so its prebuild content-sync and static export are
  # verified on every push — it deploys independently and isn't covered above.
  marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install
        working-directory: marketing
        run: npm ci

      - name: Typecheck
        working-directory: marketing
        run: npx tsc --noEmit

      # `npm run build` runs prebuild (sync-shared-content) then the static export.
      - name: Build (static export)
        working-directory: marketing
        run: npm run build
