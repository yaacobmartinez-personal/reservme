# Render Blueprint — deploys ReservMe as a SINGLE web service (worker-free), so
# it fits Render's free plan without a paid background worker.
#
#   • reservme-web — the Next.js app (apex marketing + booking, app dashboard,
#                    admin console). Default CMD is `node server.js`.
#
# Worker-free operation: INLINE_JOBS=true runs the event-driven jobs (booking
# confirmation email, webhook delivery) in the request; an external cron hits
# GET /api/cron (gated by CRON_SECRET) every ~10 min to run the scheduled jobs
# (hold-sweep, billing reminders + suspend, loyalty, engagement).
#
# Paid path: to run the dedicated pg-boss worker instead, un-comment the
# reservme-worker service below, remove INLINE_JOBS from the env group, and stop
# calling /api/cron. Render workers require a paid plan.
#
# The web `plan: free` deploys at no cost; free instances spin down when idle
# (cold start on first hit), so a cron ping doubles as a keep-warm. Bump to
# `starter` for production.
#
# Migrations run as the container starts (dockerCommand → sh start.sh: migrate.js,
# then the server); see the note on the service. No Render Postgres — DATABASE_URL points at your DB (Neon).
#
# NOTE: NEXT_PUBLIC_* are inlined into the client bundle at *build* time (see the
# Dockerfile), where they default to the reservme.pro domains. If your public
# domains differ, change them in the Dockerfile too — the runtime values below
# only affect server-side host routing.

services:
  - type: web
    name: reservme-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/healthz
    # Migrations run as the container starts (docker/start.sh), not as a
    # preDeployCommand: pre-deploy commands need a paid instance type, and a
    # Blueprint that uses one asks for payment details even on `plan: free`.
    # A script, not an inline `sh -c "…"`: Render does not shell-parse quotes
    # in dockerCommand.
    dockerCommand: sh start.sh
    envVars:
      - fromGroup: reservme

  # Paid path — a dedicated background worker instead of INLINE_JOBS + /api/cron.
  # Un-comment this, remove INLINE_JOBS from the env group, and stop the cron.
  # - type: worker
  #   name: reservme-worker
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   region: singapore
  #   plan: starter
  #   dockerCommand: node worker.js
  #   envVars:
  #     - fromGroup: reservme

envVarGroups:
  - name: reservme
    envVars:
      # Your Postgres connection string (e.g. Neon). Shared by web + worker.
      - key: DATABASE_URL
        sync: false
      # 32+ byte secret for Better Auth session signing.
      - key: BETTER_AUTH_SECRET
        sync: false
      # The app-host origin, e.g. https://app.reservme.pro
      - key: BETTER_AUTH_URL
        sync: false
      # Host routing (read server-side at runtime). Match your real domains.
      - key: NEXT_PUBLIC_APEX_HOST
        value: reservme.pro
      - key: NEXT_PUBLIC_APP_HOST
        value: app.reservme.pro
      - key: NEXT_PUBLIC_ADMIN_HOST
        value: admin.reservme.pro
      - key: NEXT_PUBLIC_PROTOCOL
        value: https
      # Transactional email (Resend). Without a key, mail is logged, not sent.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: ReservMe <bookings@reservme.pro>
      # Optional: Cloudflare Turnstile (booking bot protection) + Sentry (errors).
      - key: TURNSTILE_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Optional: image storage on Cloudflare R2. Set ALL FIVE to store logos,
      # cover photos, court images and QR codes in R2; leave blank to fall back
      # to size-capped data URLs in Postgres. R2_PUBLIC_URL is the bucket's
      # public domain (its r2.dev URL or a custom domain), not the S3 endpoint.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Optional: send email through Brevo's HTTP API — for hosts that block
      # SMTP (Render's free plan does). The sender in EMAIL_FROM must be
      # verified in Brevo. Used when SMTP_HOST is unset.
      - key: BREVO_API_KEY
        sync: false
      # Optional: send email over SMTP instead of Resend. Set SMTP_HOST to
      # enable (it takes priority over RESEND_API_KEY). From address is
      # EMAIL_FROM above.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Worker-free operation (this single-service Blueprint). Run event-driven
      # jobs in-process, and drive scheduled jobs via an external cron hitting
      # GET /api/cron with `Authorization: Bearer <CRON_SECRET>`. Remove
      # INLINE_JOBS if you re-enable the dedicated worker above.
      - key: INLINE_JOBS
        value: "true"
      - key: CRON_SECRET
        sync: false
